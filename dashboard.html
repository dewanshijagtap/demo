<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>College — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="max-width:900px;margin:40px auto;padding:20px">
    <div class="card">
      <h2 style="margin:0 0 6px">Welcome, Student</h2>
      <div class="small" style="margin-bottom:12px">Branch: Computer Science</div>

      <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
        <div style="padding:12px;border-radius:8px;background:#f8fafc">Courses<br><small class="small">View enrolled</small></div>
        <div style="padding:12px;border-radius:8px;background:#f8fafc">Attendance<br><small class="small">View %</small></div>
        <div style="padding:12px;border-radius:8px;background:#f8fafc">Notices<br><small class="small">College announcements</small></div>
      </section>

      <p class="small" style="margin-top:14px">This is a static dashboard mockup — add dynamic features with JS or backend later.</p>
      <p style="margin-top:10px"><a href="login.html" class="link">Sign out</a></p>
    </div>
  </div>
</body>
</html>
